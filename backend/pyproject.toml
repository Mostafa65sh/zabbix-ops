[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zabbix-ops-backend"
version = "0.1.0"
description = "Enterprise Zabbix Operations UI Backend API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0,<0.120.0",
    "uvicorn[standard]>=0.28.0,<0.35.0",
    "pydantic>=2.6.0,<3.0.0",
    "pydantic-settings>=2.2.0,<3.0.0",
    "httpx>=0.27.0,<0.29.0",
    "sqlalchemy>=2.0.25,<2.1.0",
    "alembic>=1.13.0,<1.15.0",
    "psycopg2-binary>=2.9.9,<3.0.0",
    "python-dotenv>=1.0.1,<1.1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<0.26.0"
]

[tool.pytest.ini_options]
testpaths = ["tests", "../modules"]
pythonpath = [".", ".."]
addopts = "--import-mode=importlib"


